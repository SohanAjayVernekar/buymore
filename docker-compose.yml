name: buymore-poc
x-backend: &backend
  build: ./backend
  environment: &environment
    POSTGRES_URL: postgresql+psycopg://${POSTGRES_USER:-buymore}:${POSTGRES_PASSWORD:-local_poc_only}@postgres:5432/${POSTGRES_DB:-buymore}
    MONGODB_URL: mongodb://mongo:27017
    MONGODB_DATABASE: ${MONGODB_DATABASE:-buymore}
    ELASTICSEARCH_URL: http://elasticsearch:9200
    ELASTICSEARCH_INDEX: ${ELASTICSEARCH_INDEX:-orders}
    RABBITMQ_URL: amqp://${RABBITMQ_USER:-buymore}:${RABBITMQ_PASSWORD:-local_poc_only}@rabbitmq:5672//
    CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:15174}
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-buymore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_poc_only}
      POSTGRES_DB: ${POSTGRES_DB:-buymore}
    ports: ["127.0.0.1:15434:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 20
  mongo:
    image: mongo:7
    ports: ["127.0.0.1:27020:27017"]
    volumes: ["mongodata:/data/db"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      retries: 20
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports: ["127.0.0.1:19202:9200"]
    volumes: ["esdata:/usr/share/elasticsearch/data"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s'"]
      interval: 10s
      retries: 30
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-buymore}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-local_poc_only}
    ports: ["127.0.0.1:15675:5672", "127.0.0.1:25675:15672"]
    volumes: ["rabbitdata:/var/lib/rabbitmq"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 20
  setup:
    <<: *backend
    command: ["sh", "-c", "python -m scripts.migrate && python -m scripts.seed"]
    depends_on:
      postgres: {condition: service_healthy}
      mongo: {condition: service_healthy}
      elasticsearch: {condition: service_healthy}
  api:
    <<: *backend
    ports: ["127.0.0.1:18002:8000"]
    depends_on:
      setup: {condition: service_completed_successfully}
      rabbitmq: {condition: service_healthy}
  worker:
    <<: *backend
    command: ["celery", "-A", "app.sync.celery", "worker", "--loglevel=info", "--concurrency=2"]
    depends_on:
      setup: {condition: service_completed_successfully}
      rabbitmq: {condition: service_healthy}
  frontend:
    build: ./frontend
    ports: ["127.0.0.1:15174:80", "127.0.0.1:80:80", "127.0.0.1:443:443"]
    volumes: ["./frontend/certs:/etc/nginx/certs:ro"]
    depends_on: [api]
volumes:
  pgdata:
  mongodata:
  esdata:
  rabbitdata:
