server {
  listen 80;
  listen 443 ssl;
  ssl_certificate /etc/nginx/certs/buymore.com.pem;
  ssl_certificate_key /etc/nginx/certs/buymore.com-key.pem;
  root /usr/share/nginx/html;
  index index.html;
  location /api/ { proxy_pass http://api:8000; }
  location / { try_files $uri $uri/ /index.html; }
}
